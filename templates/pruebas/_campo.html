<div class="campo{% if campo.field.widget.input_type == 'checkbox' %} campo-casilla{% endif %}{% if campo.errors %} con-error{% endif %}{% if campo.name in 'objetivo precondiciones descripcion' %} campo-ancho{% endif %}">
  {% if campo.field.widget.input_type == "checkbox" and not campo.field.widget.allow_multiple_selected %}
    <label>{{ campo }} <span>{{ campo.label }}</span></label>
  {% else %}
    <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span class="requerido" aria-hidden="true">*</span>{% endif %}</label>
    {{ campo }}
  {% endif %}
  {% if campo.help_text %}<small class="texto-tenue">{{ campo.help_text }}</small>{% endif %}
  {% for e in campo.errors %}<small class="error">{{ e }}</small>{% endfor %}
</div>
