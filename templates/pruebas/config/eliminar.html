{% extends "pruebas/config/_base.html" %}
{% block config %}
<h2 class="titulo-config">{{ titulo }} · Eliminar</h2>
<form method="post" class="confirmacion">
  {% csrf_token %}
  <p>¿Seguro que quieres eliminar <strong>«{{ obj }}»</strong>? Si está en uso no se podrá eliminar; en ese caso puedes desactivarlo.</p>
  <div class="formulario-acciones">
    <button class="boton boton-peligro-solido" type="submit">Sí, eliminar</button>
    <a class="boton boton-sutil" href="{% url 'pruebas:config_lista' d.clave %}">Cancelar</a>
  </div>
</form>
{% endblock %}
