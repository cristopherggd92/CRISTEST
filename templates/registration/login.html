{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block cuerpo %}
<div class="pantalla-login">
  <button class="boton-icono flotante" type="button" data-alternar-tema aria-label="Cambiar a modo oscuro" title="Cambiar tema">
    <svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <form class="tarjeta tarjeta-login" method="post">
    {% csrf_token %}
    <div class="marca marca-grande"><span class="marca-logo">CT</span><span>CRISTEST</span></div>
    <p class="texto-tenue">Gestión de casos, ciclos y planes de prueba</p>
    {% if form.non_field_errors %}
      <div class="mensaje mensaje-error">Usuario o contraseña incorrectos.</div>
    {% endif %}
    <label class="campo">
      <span>Usuario</span>
      <input type="text" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
    </label>
    <label class="campo">
      <span>Contraseña</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="boton boton-primario ancho-completo" type="submit">Ingresar</button>
  </form>
</div>
{% endblock %}
